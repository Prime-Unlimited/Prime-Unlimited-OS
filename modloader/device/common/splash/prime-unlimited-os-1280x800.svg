  <text x="80" y="718" font-family="'Space Mono', 'Courier New', monospace" font-size="20" fill="#5B616B">$ pu flash --device prime4-g2 <tspan fill="#FF5A1F">✓</tspan></text>
  <rect x="460" y="700" width="11" height="22" fill="#FF5A1F"></rect>
