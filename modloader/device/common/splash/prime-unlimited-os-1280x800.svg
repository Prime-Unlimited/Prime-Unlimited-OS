    <rect x="1087" y="10" width="26" height="84" rx="13" fill="#FF5A1F"></rect>
  </g>
  <circle cx="108" cy="116" r="25" fill="none" stroke="#F2F0EA" stroke-width="6"></circle>
  <circle cx="108" cy="116" r="13" fill="#F2F0EA"></circle>
