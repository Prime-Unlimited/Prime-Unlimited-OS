<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="800" viewBox="0 0 1280 800">
  <defs>
    <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse"><rect width="4" height="1" fill="#fff" fill-opacity=".018"></rect></pattern>
    <clipPath id="c"><rect width="1280" height="800"></rect></clipPath>
  </defs>
  <g clip-path="url(#c)">
    <rect width="1280" height="800" fill="#0E0F11"></rect>
