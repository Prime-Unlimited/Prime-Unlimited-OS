name: Mod promotion

# GitHub only accepts workflow_dispatch when this entry point exists on the
# default branch. All promotion logic remains versioned with the Modloader.
on:
  workflow_dispatch:
    inputs:
      mod:
        description: Mod id, for example splash-manager
        required: true
        type: string
      version:
        description: Exact version directory to promote
        required: true
        type: string
      jc11s_sha256:
        description: Confirmed JC11S zip SHA-256, or empty when that device is not targeted
        required: false
        type: string
        default: ""
      jp24_sha256:
        description: Confirmed JP24 zip SHA-256, or empty when that device is not targeted
        required: false
        type: string
        default: ""

permissions:
  contents: write

jobs:
  promote:
    uses: Prime-Unlimited/Prime-Unlimited-OS/.github/workflows/mod-promote.yml@feat/prime-unlimited-mod-loader
    with:
      mod: ${{ inputs.mod }}
      version: ${{ inputs.version }}
      jc11s_sha256: ${{ inputs.jc11s_sha256 }}
      jp24_sha256: ${{ inputs.jp24_sha256 }}
    secrets: inherit
