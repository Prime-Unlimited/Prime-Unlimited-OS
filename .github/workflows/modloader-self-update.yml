name: Modloader self-update bundles

on:
  workflow_dispatch:
  push:
    branches: [feat/prime-unlimited-mod-loader]
    tags: ['modloader-v*']
    paths: ['modloader/**', '.github/workflows/modloader-self-update.yml']

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: {go-version: '1.24.x'}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install pytest
      - run: cd modloader/updater && go test ./...
      - run: cd modloader/device/jc11s/runtime-api && GO111MODULE=off go test ./...
      - run: python -m pytest -q modloader/ui
  package:
    needs: test
    runs-on: ubuntu-24.04
    strategy: {matrix: {target: [jc11s, jp24]}}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: {go-version: '1.24.x'}
      - run: python3 modloader/updater/package.py --target ${{ matrix.target }} --output dist/a
      - run: python3 modloader/updater/package.py --target ${{ matrix.target }} --output dist/b
      - name: Verify reproducibility, allowlist and binary identity
        run: |
          cmp dist/a/*.zip dist/b/*.zip
          python3 - <<'PY'
          import glob, zipfile
          expected={"VERSION.json","bin/modloader-api-start.sh","bin/modloader-updater-start.sh","bin/prime-unlimited-runtime-api","bin/prime-unlimited-self-updater","ui/ModLoader.template.qml","ui/OverlayHost.template.qml"}
          package=glob.glob("dist/a/*.zip")[0]
          with zipfile.ZipFile(package) as archive:
              assert set(archive.namelist()) == expected, archive.namelist()
              for name in ("bin/prime-unlimited-runtime-api","bin/prime-unlimited-self-updater"):
                  assert archive.read(name).startswith(b"\x7fELF")
          PY
          mkdir -p inspect release
          unzip -q dist/a/*.zip 'bin/prime-unlimited-*' -d inspect
          file inspect/bin/*
          if [ "${{ matrix.target }}" = jc11s ]; then file inspect/bin/* | grep -q 'ELF 32-bit.*ARM'; else file inspect/bin/* | grep -q 'ELF 64-bit.*ARM aarch64'; fi
          cp dist/a/*.zip release/
      - uses: actions/upload-artifact@v4
        with: {name: 'modloader-self-update-${{ matrix.target }}', path: 'release/*.zip', if-no-files-found: error}
  release:
    if: startsWith(github.ref, 'refs/tags/modloader-v')
    needs: package
    runs-on: ubuntu-24.04
    permissions: {contents: write}
    steps:
      - uses: actions/download-artifact@v4
        with: {pattern: modloader-self-update-*, path: release, merge-multiple: true}
      - run: cd release && sha256sum *.zip > SHA256SUMS.txt && stat --printf='%n %s bytes\n' *.zip > SIZES.txt
      - env: {GH_TOKEN: '${{ github.token }}'}
        run: gh release create "$GITHUB_REF_NAME" release/* --repo "$GITHUB_REPOSITORY" --verify-tag --title "Prime Unlimited Modloader ${GITHUB_REF_NAME#modloader-v}" --notes "Signed-manifest artifacts for the independent self-updater."
