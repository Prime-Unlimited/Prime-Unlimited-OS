name: Prime Clock packages

on:
  workflow_dispatch:
  push:
    branches: [feat/prime-unlimited-mod-loader]
    paths:
      - 'mods/prime-clock/**'
      - 'modloader/**'
      - '.github/workflows/prime-clock.yml'
      - '.github/workflows/reusable-mod-release.yml'
    tags: ['prime-clock-v*']
  pull_request:
    paths:
      - 'mods/prime-clock/**'
      - 'modloader/**'
      - '.github/workflows/prime-clock.yml'
      - '.github/workflows/reusable-mod-release.yml'

jobs:
  build-and-release:
    permissions:
      contents: read
    uses: ./.github/workflows/reusable-mod-release.yml
    with:
      mod-id: prime-clock
      mod-dir: mods/prime-clock
      release-title: Prime Clock
      tag-prefix: prime-clock-v
