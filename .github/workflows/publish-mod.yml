name: Publish device mod

on:
  workflow_dispatch:
    inputs:
      mod_id:
        description: Catalog mod id currently marked dev
        required: true
        type: string
      device:
        description: Target device
        required: true
        type: choice
        options: [jc11s, jp24]
      package_path:
        description: Repository path to the device-specific ZIP
        required: true
        type: string

permissions:
  contents: write
concurrency:
  group: publish-mod-${{ inputs.mod_id }}-${{ inputs.device }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: mod-publishing
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12', cache: pip}
      - run: pip install 'cryptography>=43,<46'
      - name: Read release version
        id: meta
        env:
          MOD_ID: "${{ inputs.mod_id }}"
          DEVICE: "${{ inputs.device }}"
          PACKAGE_PATH: "${{ inputs.package_path }}"
        shell: bash
        run: |
          set -euo pipefail
          test -f "$PACKAGE_PATH"
          version="$(jq -r --arg id "$MOD_ID" '.mods[] | select(.id == $id) | .version' "modloader/catalog/$DEVICE.json")"
          test -n "$version" && test "$version" != null
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=${MOD_ID}-v${version}-${DEVICE}" >> "$GITHUB_OUTPUT"
          echo "asset=${MOD_ID}-v${version}-${DEVICE}.zip" >> "$GITHUB_OUTPUT"
      - name: Update and sign catalog
        env:
          CATALOG_SIGNING_KEY: "${{ secrets.CATALOG_SIGNING_KEY }}"
          CATALOG_KEY_ID: "${{ vars.CATALOG_KEY_ID }}"
        run: >-
          python tools/publish_mod.py --catalog modloader/catalog/${{ inputs.device }}.json
          --signature modloader/catalog/${{ inputs.device }}.sig.json
          --package '${{ steps.meta.outputs.asset }}' --mod-id '${{ inputs.mod_id }}'
          --device '${{ inputs.device }}'
          --asset-url 'https://github.com/${{ github.repository }}/releases/download/${{ steps.meta.outputs.tag }}/${{ steps.meta.outputs.asset }}'
          --key-id "$CATALOG_KEY_ID" --private-key "$CATALOG_SIGNING_KEY"
      - name: Create device release
        env:
          GH_TOKEN: "${{ github.token }}"
          PACKAGE_PATH: "${{ inputs.package_path }}"
          RELEASE_TAG: "${{ steps.meta.outputs.tag }}"
          RELEASE_ASSET: "${{ steps.meta.outputs.asset }}"
        shell: bash
        run: |
          set -euo pipefail
          cp "$PACKAGE_PATH" "$RELEASE_ASSET"
          gh release create "$RELEASE_TAG" "$RELEASE_ASSET" --title '${{ inputs.mod_id }} ${{ steps.meta.outputs.version }} (${{ inputs.device }})' --generate-notes
      - name: Commit published catalog
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add 'modloader/catalog/${{ inputs.device }}.json' 'modloader/catalog/${{ inputs.device }}.sig.json'
          git commit -m 'Publish ${{ inputs.mod_id }} for ${{ inputs.device }}'
          git push

