name: Offline SSH PoC
on:
  pull_request:
  push:
    branches: [dev/project-foundation, feat/jc11s-offline-ssh-poc]
jobs:
  linux-backend:
    runs-on: ubuntu-24.04
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install filesystem and ARM tools
        run: |
          sudo apt-get update
          sudo apt-get install -y e2fsprogs gcc-arm-linux-gnueabihf binutils-arm-linux-gnueabihf libegl1 libopengl0
      - run: python -m pip install -e '.[dev]'
      - run: python -m pytest
      - run: ruff check core tests
