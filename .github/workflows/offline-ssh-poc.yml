name: Offline SSH PoC
on:
  pull_request:
  push:
    branches: [dev/project-foundation, feat/jc11s-offline-ssh-poc]
jobs:
  linux-backend:
    runs-on: ubuntu-24.04
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install filesystem and ARM tools
        run: |
          sudo apt-get update
          sudo apt-get install -y e2fsprogs gcc-arm-linux-gnueabihf binutils-arm-linux-gnueabihf libegl1 libopengl0
      - run: python -m pip install -e '.[dev]'
      - run: python -m pytest
      - run: ruff check core tests
      - name: Build reproducible ARMv7 hook
        run: |
          mkdir -p dist-hook
          sh tools/build-jc11s-hook.sh dist-hook/libprime-ssh.so
          sha256sum dist-hook/libprime-ssh.so > dist-hook/libprime-ssh.so.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: jc11s-armv7-hook
          path: dist-hook/
  windows-executable:
    needs: linux-backend
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: msys2/setup-msys2@v2
        with:
          msystem: MSYS
          install: e2fsprogs binutils
      - uses: actions/download-artifact@v4
        with:
          name: jc11s-armv7-hook
          path: bootstrap/jc11s
      - name: Collect native Windows filesystem runtime
        shell: pwsh
        run: tools/collect-windows-e2fsprogs.ps1 -Source C:\msys64\usr -Destination vendor\windows\e2fsprogs
      - run: python -m pip install -e ".[dev]"
      - name: Test native image build without WSL
        run: python -m pytest tests/test_windows_installer.py -m native_windows
      - run: python -m PyInstaller packaging/prime-unlimited-os.spec
      - uses: actions/upload-artifact@v4
        with:
          name: Prime-Unlimited-OS-Windows-test
          path: dist/Prime-Unlimited-OS.exe
